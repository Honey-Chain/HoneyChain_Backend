name: Deploy Frontend to AIC VPS
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 162.19.81.122
          port: 20130
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/services/honeychain/frontend/deploy.sh
