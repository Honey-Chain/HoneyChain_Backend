name: Build & Deploy Backend to AIC VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd backend
          npm ci
          npm run build

      - name: Deploy to VPS via SSH & Rsync
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: 162.19.81.122
          PORT: 20130
          USER: root
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts

          # Pull non-build files from git repository on VPS
          ssh -i ~/.ssh/deploy_key -p $PORT $USER@$HOST "cd /opt/services/honeychain && git fetch origin main && git checkout main && git pull origin main"

          # Sync the compiled dist directory directly to production
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p $PORT" backend/dist/ $USER@$HOST:/opt/services/honeychain/backend/dist/

          # Install production runtime dependencies and restart service
          ssh -i ~/.ssh/deploy_key -p $PORT $USER@$HOST "cd /opt/services/honeychain/backend && npm install --omit=dev --no-audit && systemctl restart honeychain-backend.service && systemctl status honeychain-backend.service --no-pager"
