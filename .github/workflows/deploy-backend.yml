name: Deploy Backend to AIC VPS
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 162.19.81.122
          port: 20130
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/services/honeychain/backend/deploy.sh
