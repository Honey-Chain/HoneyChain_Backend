<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoneyChain · API Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #080705; color: #f5f0e8; font-family: 'Inter', sans-serif; font-size: 13px; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3d2e18; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }

    /* JSON syntax colors */
    .j-key  { color: #f59e0b; }
    .j-str  { color: #34d399; }
    .j-num  { color: #38bdf8; }
    .j-bool { color: #c084fc; }
    .j-null { color: #71717a; }

    /* Method colors */
    .m-GET    { background: rgba(16,185,129,0.12); color: #10b981; }
    .m-POST   { background: rgba(245,158,11,0.12); color: #f59e0b; }
    .m-PATCH  { background: rgba(59,130,246,0.12);  color: #60a5fa; }
    .m-DELETE { background: rgba(239,68,68,0.12);   color: #f87171; }
    .m-PUT    { background: rgba(139,92,246,0.12);  color: #a78bfa; }

    /* Status badge */
    .s-2xx { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .s-3xx { background: rgba(59,130,246,0.12);  color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .s-4xx { background: rgba(249,115,22,0.12);  color: #fb923c; border: 1px solid rgba(249,115,22,0.3); }
    .s-5xx { background: rgba(239,68,68,0.12);   color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .s-err { background: rgba(239,68,68,0.12);   color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    /* Endpoint item */
    .ep-item { transition: all 0.12s ease; }
    .ep-item:hover { background: #1a140d; }
    .ep-item.ep-active { background: #1a140d; border-color: #f59e0b !important; box-shadow: 0 0 12px rgba(245,158,11,0.1); }

    /* Tab underline */
    .tab-active { color: #f59e0b !important; position: relative; }
    .tab-active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 2px; background: #f59e0b;
    }

    /* Role button */
    .role-btn { transition: all 0.12s ease; }
    .role-btn.role-active {
      background: #f59e0b; color: #0b0907; font-weight: 700;
      box-shadow: 0 0 10px rgba(245,158,11,0.35);
    }
    .role-btn.role-noauth.role-active { background: #4b5563; color: #fff; box-shadow: none; }

    /* Send button */
    #sendBtn { transition: all 0.15s ease; }
    #sendBtn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
    #sendBtn:active:not(:disabled) { transform: translateY(0); }
    #sendBtn:disabled { opacity: 0.55; transform: none; cursor: not-allowed; }

    /* Pulse */
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #1a140d; border: 1px solid #f59e0b;
      color: #f5f0e8; padding: 10px 18px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 1000; opacity: 0; transform: translateY(8px);
      transition: all 0.2s ease; pointer-events: none;
    }
    #toast.toast-show { opacity: 1; transform: translateY(0); }

    /* Code textarea */
    .code-area {
      font-family: 'Fira Code', monospace; font-size: 12px;
      background: #100d08; border: 1px solid #221b11; border-radius: 6px;
      color: #f5f0e8; padding: 10px 12px; width: 100%;
      resize: vertical; outline: none; line-height: 1.6; min-height: 180px;
    }
    .code-area:focus { border-color: #f59e0b; }

    /* KV inputs */
    .kv-input {
      width: 100%; background: #100d08; border: 1px solid #221b11;
      border-radius: 4px; color: #f5f0e8;
      font-family: 'Fira Code', monospace; font-size: 11.5px;
      padding: 5px 8px; outline: none;
    }
    .kv-input:focus { border-color: #f59e0b; }
    .kv-input[readonly] { opacity: 0.55; cursor: default; }

    .kv-row { border-bottom: 1px solid rgba(34,27,17,0.7); }

    /* Response pre */
    #resBody {
      font-family: 'Fira Code', monospace; font-size: 12px;
      line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin: 0;
    }

    /* Sidebar category */
    .cat-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: #7a6e60; padding: 10px 10px 4px;
    }

    /* URL bar focus */
    #urlBar:focus-within { border-color: #f59e0b !important; }

    /* RBAC banner */
    .rbac-banner {
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.35);
      border-radius: 6px; padding: 8px 12px; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }

    /* Ghost btn */
    .ghost-btn {
      background: #1a140d; border: 1px solid #221b11; color: #c2b5a4;
      font-size: 11.5px; padding: 5px 12px; border-radius: 5px; cursor: pointer;
      transition: all 0.12s ease;
    }
    .ghost-btn:hover { border-color: #3d2e18; color: #f5f0e8; }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">

<!-- ═══════ HEADER ═══════ -->
<header style="background:#0f0c08;border-bottom:1px solid #221b11;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px;flex-shrink:0;z-index:50;">

  <!-- Brand -->
  <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <div style="width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#d97706,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 14px rgba(245,158,11,0.32);">⬢</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;font-weight:700;letter-spacing:-0.01em;">HoneyChain</span>
      <span style="background:rgba(245,158,11,0.1);color:#f59e0b;border:1px solid rgba(245,158,11,0.28);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.05em;">API Workbench</span>
    </div>
  </div>

  <!-- RBAC Switcher -->
  <div style="display:flex;align-items:center;gap:4px;flex:1;justify-content:center;flex-wrap:wrap;">
    <span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#7a6e60;margin-right:4px;">Persona:</span>
    <button class="role-btn role-active" data-role="admin"       onclick="switchRole('admin')"       style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">👑 Admin</button>
    <button class="role-btn"             data-role="beekeeper"   onclick="switchRole('beekeeper')"   style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">🐝 Beekeeper</button>
    <button class="role-btn"             data-role="lab"         onclick="switchRole('lab')"         style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">🧪 Lab</button>
    <button class="role-btn"             data-role="processor"   onclick="switchRole('processor')"   style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">🏭 Processor</button>
    <button class="role-btn"             data-role="distributor" onclick="switchRole('distributor')" style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">🚚 Distributor</button>
    <button class="role-btn"             data-role="auditor"     onclick="switchRole('auditor')"     style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">🔍 Auditor</button>
    <button class="role-btn role-noauth" data-role="none"        onclick="switchRole('none')"        style="font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#c2b5a4;background:transparent;">🔓 No Auth</button>
  </div>

  <!-- User Pill + Health -->
  <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <div id="userPill" style="background:#1a140d;border:1px solid #3d2e18;border-radius:7px;padding:5px 11px;display:flex;align-items:center;gap:8px;font-size:11.5px;">
      <span id="userTag" style="font-weight:700;color:#f59e0b;">👑 ADMIN</span>
      <span id="userName" style="color:#f5f0e8;font-weight:600;">System Admin</span>
      <span id="userWallet" title="" style="font-family:'Fira Code',monospace;font-size:10px;background:rgba(245,158,11,0.1);color:#f59e0b;padding:2px 6px;border-radius:4px;">0x65af…208d</span>
    </div>
    <div id="healthBadge" style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.25);">
      <span class="pulse-dot" style="width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block;"></span>
      <span id="healthTxt">Sepolia (11155111)</span>
    </div>
  </div>
</header>

<!-- ═══════ BODY ═══════ -->
<div style="display:flex;flex:1;overflow:hidden;">

  <!-- ── SIDEBAR ── -->
  <aside style="width:340px;min-width:290px;background:#0f0c08;border-right:1px solid #221b11;display:flex;flex-direction:column;flex-shrink:0;">

    <!-- Search + Category filters -->
    <div style="padding:10px;border-bottom:1px solid #221b11;">
      <div style="position:relative;margin-bottom:8px;">
        <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#7a6e60;pointer-events:none;font-size:12px;">🔍</span>
        <input id="searchInput" type="text" placeholder="Search endpoints, methods…" oninput="filterEndpoints()"
          style="width:100%;background:#100d08;border:1px solid #221b11;border-radius:6px;padding:7px 10px 7px 28px;color:#f5f0e8;font-size:12px;outline:none;transition:border-color 0.15s;"
          onfocus="this.style.borderColor='#f59e0b'" onblur="this.style.borderColor='#221b11'">
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <button class="filter-btn" data-cat="all"       onclick="filterByCategory('all')"       style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #f59e0b;background:rgba(245,158,11,0.1);color:#f59e0b;cursor:pointer;font-weight:600;">All <span id="totalCount">0</span></button>
        <button class="filter-btn" data-cat="batches"   onclick="filterByCategory('batches')"   style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">Batches</button>
        <button class="filter-btn" data-cat="iot"       onclick="filterByCategory('iot')"       style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">IoT</button>
        <button class="filter-btn" data-cat="ml"        onclick="filterByCategory('ml')"        style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">AI / ML</button>
        <button class="filter-btn" data-cat="auth"      onclick="filterByCategory('auth')"      style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">Auth</button>
        <button class="filter-btn" data-cat="orgs"      onclick="filterByCategory('orgs')"      style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">Orgs</button>
        <button class="filter-btn" data-cat="sanctuary" onclick="filterByCategory('sanctuary')" style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">Apiaries</button>
        <button class="filter-btn" data-cat="analytics" onclick="filterByCategory('analytics')" style="font-size:10.5px;padding:3px 9px;border-radius:4px;border:1px solid #221b11;background:#141008;color:#7a6e60;cursor:pointer;">Analytics</button>
      </div>
    </div>

    <!-- Endpoint list -->
    <div id="endpointList" style="flex:1;overflow-y:auto;padding:6px;"></div>
  </aside>

  <!-- ── MAIN WORKBENCH ── -->
  <main style="flex:1;display:flex;flex-direction:column;overflow:hidden;background:#080705;">

    <!-- URL bar -->
    <div style="padding:12px 16px;background:#0f0c08;border-bottom:1px solid #221b11;display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <select id="methodSel" onchange="onMethodChange()"
        style="background:#1a140d;border:1px solid #221b11;border-radius:6px;padding:8px 10px;font-family:'Fira Code',monospace;font-size:12.5px;font-weight:700;cursor:pointer;outline:none;color:#10b981;min-width:90px;">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
        <option value="PUT">PUT</option>
      </select>

      <div id="urlBar" style="flex:1;display:flex;align-items:center;background:#1a140d;border:1px solid #221b11;border-radius:6px;overflow:hidden;transition:border-color 0.15s;">
        <span id="urlOrigin" style="padding:8px 10px 8px 12px;color:#7a6e60;font-family:'Fira Code',monospace;font-size:12px;background:rgba(0,0,0,0.2);border-right:1px solid #221b11;white-space:nowrap;user-select:none;"></span>
        <input id="pathInput" type="text" value="/health"
          style="flex:1;background:transparent;border:none;padding:8px 12px;color:#f5f0e8;font-family:'Fira Code',monospace;font-size:13px;outline:none;">
      </div>

      <button id="sendBtn" onclick="executeRequest()"
        style="background:linear-gradient(135deg,#d97706,#f59e0b);color:#0a0700;font-weight:700;font-size:13px;padding:9px 22px;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 0 14px rgba(245,158,11,0.28);">
        <span id="sendIcon">▶</span> Send
      </button>

      <button onclick="copyAsCurl()" title="Copy as cURL"
        style="background:#1a140d;border:1px solid #221b11;color:#c2b5a4;padding:8px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.12s;"
        onmouseover="this.style.borderColor='#3d2e18';this.style.color='#f5f0e8'"
        onmouseout="this.style.borderColor='#221b11';this.style.color='#c2b5a4'">&lt;/&gt; cURL</button>
    </div>

    <!-- Split view: Request (top) / Response (bottom) -->
    <div style="flex:1;display:grid;grid-template-rows:1fr 1fr;overflow:hidden;">

      <!-- REQUEST CONFIG -->
      <div style="display:flex;flex-direction:column;border-bottom:1px solid #221b11;background:#0f0c08;overflow:hidden;">

        <!-- Tabs -->
        <div style="display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #221b11;flex-shrink:0;background:#0f0c08;">
          <button class="tab-btn tab-active" data-tab="params"  onclick="switchTab('params')"  style="font-size:12.5px;font-weight:600;padding:10px 14px;border:none;background:transparent;cursor:pointer;color:#f59e0b;display:flex;align-items:center;gap:5px;position:relative;">Params <span id="paramBadge" style="background:#141008;font-size:10px;padding:1px 5px;border-radius:4px;color:#7a6e60;">0</span></button>
          <button class="tab-btn"            data-tab="body"    onclick="switchTab('body')"    style="font-size:12.5px;font-weight:600;padding:10px 14px;border:none;background:transparent;cursor:pointer;color:#7a6e60;display:flex;align-items:center;gap:5px;position:relative;">Body <span style="background:#141008;font-size:10px;padding:1px 5px;border-radius:4px;color:#7a6e60;">JSON</span></button>
          <button class="tab-btn"            data-tab="headers" onclick="switchTab('headers')" style="font-size:12.5px;font-weight:600;padding:10px 14px;border:none;background:transparent;cursor:pointer;color:#7a6e60;position:relative;">Headers</button>
          <button class="tab-btn"            data-tab="auth"    onclick="switchTab('auth')"    style="font-size:12.5px;font-weight:600;padding:10px 14px;border:none;background:transparent;cursor:pointer;color:#7a6e60;position:relative;">Auth &amp; RBAC</button>
          <button class="tab-btn"            data-tab="docs"    onclick="switchTab('docs')"    style="font-size:12.5px;font-weight:600;padding:10px 14px;border:none;background:transparent;cursor:pointer;color:#7a6e60;position:relative;">Docs &amp; Schema</button>
        </div>

        <!-- Pane content -->
        <div style="flex:1;overflow-y:auto;padding:14px 16px;">

          <!-- PARAMS PANE -->
          <div id="paneParams">
            <div id="rbacBanner" class="rbac-banner" style="display:none;">
              <div style="font-size:12px;color:#f5f0e8;">⚠ <strong>RBAC Notice:</strong> <span id="rbacBannerTxt"></span></div>
              <button id="rbacSwitchBtn" style="background:#f59e0b;color:#0b0907;border:none;padding:4px 12px;border-radius:4px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;"></button>
            </div>

            <!-- Path params -->
            <div id="pathParamSec" style="display:none;margin-bottom:14px;">
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#f59e0b;margin-bottom:8px;">🔗 Path Variables</div>
              <table style="width:100%;border-collapse:collapse;">
                <thead><tr style="border-bottom:1px solid #221b11;">
                  <th style="text-align:left;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:30%;">Variable</th>
                  <th style="text-align:left;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:50%;">Value</th>
                  <th style="text-align:left;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:20%;">Type</th>
                </tr></thead>
                <tbody id="pathParamBody"></tbody>
              </table>
            </div>

            <!-- Query params -->
            <div>
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#f59e0b;margin-bottom:8px;">🔎 Query Parameters</div>
              <table style="width:100%;border-collapse:collapse;">
                <thead><tr style="border-bottom:1px solid #221b11;">
                  <th style="text-align:center;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:10%;">On</th>
                  <th style="text-align:left;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:30%;">Key</th>
                  <th style="text-align:left;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:40%;">Value</th>
                  <th style="text-align:left;padding:5px 8px;font-size:11px;color:#7a6e60;font-weight:600;text-transform:uppercase;width:20%;">Desc</th>
                </tr></thead>
                <tbody id="queryParamBody"></tbody>
              </table>
              <button onclick="addQueryParam()" class="ghost-btn" style="margin-top:10px;">+ Add Param</button>
            </div>
          </div>

          <!-- BODY PANE -->
          <div id="paneBody" style="display:none;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <div style="font-size:12px;color:#c2b5a4;">Format: <strong style="color:#f59e0b;">JSON (application/json)</strong></div>
              <div style="display:flex;gap:6px;">
                <button onclick="formatJson()" class="ghost-btn" style="font-size:11px;padding:4px 10px;">👁 Format</button>
                <button onclick="resetBody()"  class="ghost-btn" style="font-size:11px;padding:4px 10px;">↺ Reset</button>
                <button onclick="clearBody()"  class="ghost-btn" style="font-size:11px;padding:4px 10px;">✕ Clear</button>
              </div>
            </div>
            <textarea id="bodyEditor" class="code-area" spellcheck="false" placeholder="Enter JSON request payload…"></textarea>
          </div>

          <!-- HEADERS PANE -->
          <div id="paneHeaders" style="display:none;">
            <table style="width:100%;border-collapse:collapse;">
              <thead><tr style="border-bottom:1px solid #221b11;">

    if (d.status === "ok") {
      badge.style.cssText = "display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.25);";
      txt.textContent = "Online \xB7 " + (d.blockchain?.network || "Sepolia") + " (11155111)";
    } else {
      badge.style.cssText = "display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:rgba(249,115,22,0.1);color:#fb923c;border:1px solid rgba(249,115,22,0.25);";
      txt.textContent = "Degraded";
    }
  } catch {
    badge.style.cssText = "display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.25);";
    txt.textContent = "Offline / Error";
  }
}

/* ================================================================
   RBAC ROLE MANAGEMENT
   ================================================================ */
async function switchRole(role) {
  document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("role-active"));
  const btn = document.querySelector(`.role-btn[data-role="${role}"]`);
  if (btn) btn.classList.add("role-active");
  S.role = role;
  if (role === "none") {
    updateUserPill(DEMO_USERS.none, "");
    updateAuthHeaderInput();
    toast("Switched to Unauthenticated mode");
    return;
  }
  await loginRole(role, true);
}

async function loginRole(role, notify) {
  const u = DEMO_USERS[role]; if (!u) return;
  const cached = localStorage.getItem("hc_token_" + role);
  if (cached) {
    S.tokens[role] = cached; updateUserPill(u, cached); updateAuthHeaderInput();
    if (notify) toast("Authenticated as " + u.name + " (" + u.tag + ")");
    return;
  }
  try {
    const r = await fetch(S.baseUrl + "/api/auth/login", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email:u.email,password:"Password123!"}) });
    const d = await r.json();
    if (d.success && d.token) {
      S.tokens[role] = d.token; localStorage.setItem("hc_token_" + role, d.token);
      updateUserPill(u, d.token); updateAuthHeaderInput();
      if (notify) toast("Logged in as " + u.name + " (" + u.tag + ")");
    } else { updateUserPill(u, ""); if (notify) toast("Login: " + (d.message || "Check credentials")); }
  } catch { updateUserPill(u, ""); }
}

function updateUserPill(u, token) {
  document.getElementById("userTag").textContent  = u.tag;
  document.getElementById("userName").textContent = u.name;
  const w = u.wallet.length > 14 ? u.wallet.substring(0,6) + "\u2026" + u.wallet.substring(u.wallet.length-4) : u.wallet;
  const wEl = document.getElementById("userWallet"); wEl.textContent = w; wEl.title = u.wallet;
  document.getElementById("authRoleVal").textContent   = u.role;
  document.getElementById("authEmailVal").textContent  = u.email;
  document.getElementById("authWalletVal").textContent = u.wallet;
  document.getElementById("authTokenVal").textContent  = token ? token.substring(0,40) + "\u2026" : "None (Unauthenticated)";
}
function updateAuthHeaderInput() {
  const tok = S.tokens[S.role];
  document.getElementById("authHeaderInput").value = tok ? "Bearer " + tok : "None";
}

/* ================================================================
   ENDPOINT LIST
   ================================================================ */
function renderEndpoints() {
  const container = document.getElementById("endpointList"); container.innerHTML = "";
  const q = S.query.toLowerCase();
  const filtered = ENDPOINTS.filter(ep => {
    const mc = S.category === "all" || ep.category === S.category;
    const mq = !q || ep.name.toLowerCase().includes(q) || ep.path.toLowerCase().includes(q) || ep.method.toLowerCase().includes(q);
    return mc && mq;
  });
  const groups = {};
  filtered.forEach(ep => { (groups[ep.categoryName] = groups[ep.categoryName] || []).push(ep); });
  for (const [cat, list] of Object.entries(groups)) {
    const label = document.createElement("div"); label.className = "cat-label";
    label.innerHTML = esc(cat) + ' <span style="background:#1a140d;color:#7a6e60;font-size:9.5px;padding:1px 6px;border-radius:99px;">' + list.length + '</span>';
    container.appendChild(label);
    list.forEach(ep => {
      const item = document.createElement("div");
      item.className = "ep-item" + (S.ep?.id === ep.id ? " ep-active" : "");
      item.style.cssText = "display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;";
      item.onclick = () => selectEndpoint(ep);
      const pub = ep.rbac.includes("public");
      const rbacBadge = pub
        ? '<span style="font-size:9.5px;padding:1px 5px;border-radius:3px;background:#1a140d;color:#7a6e60;border:1px solid #221b11;">Public</span>'
        : '<span style="font-size:9.5px;padding:1px 5px;border-radius:3px;background:rgba(245,158,11,0.08);color:#f59e0b;border:1px solid rgba(245,158,11,0.2);">\uD83D\uDD12 ' + ep.rbac.join(", ") + '</span>';
      item.innerHTML = `
        <span style="font-family:'Fira Code',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:48px;text-align:center;flex-shrink:0;" class="m-${ep.method}">${ep.method}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Fira Code',monospace;font-size:11.5px;color:#f5f0e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(ep.path)}</div>
          <div style="display:flex;align-items:center;gap:5px;margin-top:2px;">
            <span style="font-size:10.5px;color:#7a6e60;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;">${esc(ep.name)}</span>
            ${rbacBadge}
          </div>
        </div>`;
      container.appendChild(item);
    });
  }
}
function filterEndpoints() { S.query = document.getElementById("searchInput").value; renderEndpoints(); }
function filterByCategory(cat) {
  S.category = cat;
  document.querySelectorAll(".filter-btn").forEach(b => {
    const a = b.getAttribute("data-cat") === cat;
    b.style.background = a ? "rgba(245,158,11,0.1)" : "#141008";
    b.style.color      = a ? "#f59e0b" : "#7a6e60";
    b.style.borderColor= a ? "#f59e0b" : "#221b11";
    b.style.fontWeight = a ? "700" : "400";
  });
  renderEndpoints();
}

/* ================================================================
   ENDPOINT SELECTION
   ================================================================ */
function selectEndpoint(ep) {
  S.ep = ep; renderEndpoints();
  document.getElementById("methodSel").value = ep.method; onMethodChange();
  S.pathVars = { ...ep.defaultParams }; updatePath(); renderPathParams(ep);
  S.queryParams = (ep.defaultQueryParams || []).map(q => ({...q})); renderQueryParams(ep);
  const be = document.getElementById("bodyEditor");
  be.value = (ep.defaultBody && ["POST","PATCH","PUT"].includes(ep.method)) ? JSON.stringify(ep.defaultBody, null, 2) : "";
  renderDocs(ep); updateAuthHeaderInput(); checkRbac(ep);
}
function onMethodChange() {
  const sel = document.getElementById("methodSel");
  const colors = { GET:"#10b981", POST:"#f59e0b", PATCH:"#60a5fa", DELETE:"#f87171", PUT:"#a78bfa" };
  sel.style.color = colors[sel.value] || "#f5f0e8";
}

/* ================================================================
   PATH & QUERY PARAMS
   ================================================================ */
function updatePath() {
  if (!S.ep) return;
  let p = S.ep.path;
  for (const [k,v] of Object.entries(S.pathVars)) p = p.replace(":" + k, encodeURIComponent(v || ":" + k));
  const q = collectQP(); if (q.toString()) p += (p.includes("?") ? "&" : "?") + q.toString();
  document.getElementById("pathInput").value = p;
}
function renderPathParams(ep) {
  const matches = ep.path.match(/:[a-zA-Z0-9_]+/g) || [];
  const sec = document.getElementById("pathParamSec"); const tbody = document.getElementById("pathParamBody"); tbody.innerHTML = "";
  if (!matches.length) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  matches.forEach(raw => {
    const key = raw.substring(1), val = S.pathVars[key] || ep.defaultParams[key] || "";
    S.pathVars[key] = val;
    const tr = document.createElement("tr"); tr.className = "kv-row";
    tr.innerHTML = `<td style="padding:6px 8px;font-family:'Fira Code',monospace;color:#f59e0b;font-size:11.5px;">:${key}</td>
      <td style="padding:6px 8px;"><input type="text" class="kv-input" value="${esc(val)}" oninput="onPathVar('${key}',this.value)"></td>
      <td style="padding:6px 8px;font-size:10.5px;color:#7a6e60;">Path Var</td>`;
    tbody.appendChild(tr);
  });
}
function onPathVar(key, val) { S.pathVars[key] = val; updatePath(); }
function renderQueryParams(ep) {
  const tbody = document.getElementById("queryParamBody"); tbody.innerHTML = "";
  if (!S.queryParams.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="padding:10px 8px;color:#7a6e60;font-size:12px;text-align:center;">No query params. Add one below.</td></tr>';
    document.getElementById("paramBadge").textContent = "0"; return;
  }
  document.getElementById("paramBadge").textContent = S.queryParams.length;
  S.queryParams.forEach((q, i) => {
    const tr = document.createElement("tr"); tr.className = "kv-row";
    tr.innerHTML = `<td style="padding:6px 8px;text-align:center;"><input type="checkbox" ${q.enabled?"checked":""} onchange="toggleQP(${i},this.checked)"></td>
      <td style="padding:6px 8px;"><input type="text" class="kv-input" value="${esc(q.key)}" oninput="updateQPKey(${i},this.value)"></td>
      <td style="padding:6px 8px;"><input type="text" class="kv-input" value="${esc(q.value)}" oninput="updateQPVal(${i},this.value)"></td>
      <td style="padding:6px 8px;font-size:10.5px;color:#7a6e60;">${esc(q.desc||"")}</td>`;
    tbody.appendChild(tr);
  });
}
function toggleQP(i,v){ S.queryParams[i].enabled=v; updatePath(); }
function updateQPKey(i,v){ S.queryParams[i].key=v; updatePath(); }
function updateQPVal(i,v){ S.queryParams[i].value=v; updatePath(); }
function addQueryParam(){ S.queryParams.push({key:"key",value:"value",enabled:true,desc:"Custom"}); renderQueryParams(S.ep); updatePath(); }
function collectQP(){ const p=new URLSearchParams(); (S.queryParams||[]).forEach(q=>{if(q.enabled&&q.key.trim())p.append(q.key.trim(),q.value);}); return p; }

/* ================================================================
   DOCS
   ================================================================ */
function renderDocs(ep) {
  const badges = ep.rbac.map(r => `<span style="font-size:10.5px;padding:2px 7px;border-radius:3px;background:rgba(245,158,11,0.08);color:#f59e0b;border:1px solid rgba(245,158,11,0.2);margin-right:4px;">${r}</span>`).join("");
  document.getElementById("docsContent").innerHTML = `
    <h3 style="font-size:15px;font-weight:700;color:#f5f0e8;margin-bottom:8px;">${esc(ep.name)}</h3>
    <p style="margin-bottom:14px;">${esc(ep.description)}</p>
    <div style="background:#100d08;border:1px solid #221b11;border-radius:7px;padding:12px;margin-bottom:10px;">
      <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#f59e0b;margin-bottom:8px;">Endpoint Spec</div>
      <table style="font-size:12px;border-collapse:collapse;width:100%;">
        <tr><td style="color:#7a6e60;padding:3px 0;width:130px;">Method:</td><td style="font-family:'Fira Code',monospace;font-weight:700;color:#f59e0b;">${ep.method}</td></tr>
        <tr><td style="color:#7a6e60;padding:3px 0;">Full Path:</td><td style="font-family:'Fira Code',monospace;">${ep.path}</td></tr>
        <tr><td style="color:#7a6e60;padding:3px 0;">Category:</td><td>${ep.categoryName}</td></tr>
        <tr><td style="color:#7a6e60;padding:3px 0;">Required RBAC:</td><td>${badges}</td></tr>
      </table>
    </div>
    <div style="background:#100d08;border:1px solid #221b11;border-radius:7px;padding:12px;">
      <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#f59e0b;margin-bottom:6px;">Authorization Rule</div>
      <p style="font-size:12.5px;">${getRbacExp(ep.rbac)}</p>
    </div>`;
}
function getRbacExp(rbac) {
  if (rbac.includes("public")) return "This is a <strong style='color:#f5f0e8;'>Public Endpoint</strong>. No authentication required.";
  if (rbac.includes("all-authenticated")) return "Requires an <strong style='color:#f5f0e8;'>Authenticated Session</strong>. Any valid stakeholder role is authorized.";
  return "Restricted to: <strong style='color:#f5f0e8;'>" + rbac.join(" or ").toUpperCase() + "</strong>. Platform Admins always retain superuser authorization.";
}

/* ================================================================
   RBAC BANNER
   ================================================================ */
function checkRbac(ep) {
  const banner = document.getElementById("rbacBanner");
  if (ep.rbac.includes("public")) { banner.style.display = "none"; return; }
  const ok = S.role === "admin" || ep.rbac.includes("all-authenticated") || ep.rbac.includes(S.role);
  if (ok) { banner.style.display = "none"; return; }
  const rec = ep.rbac[0] === "all-authenticated" ? "beekeeper" : ep.rbac[0];
  banner.style.display = "flex";
  document.getElementById("rbacBannerTxt").innerHTML = "This endpoint requires <strong>" + ep.rbac.join(" / ") + "</strong>. You're currently <strong>" + S.role.toUpperCase() + "</strong>.";
  const btn = document.getElementById("rbacSwitchBtn"); btn.textContent = "Switch to " + rec.toUpperCase(); btn.onclick = () => switchRole(rec);
}

/* ================================================================
   TAB NAVIGATION
   ================================================================ */
function switchTab(tab) {
  ["params","body","headers","auth","docs"].forEach(t => {
    const pane = document.getElementById("pane" + t.charAt(0).toUpperCase() + t.slice(1));
    const btn  = document.querySelector(`.tab-btn[data-tab="${t}"]`);
    if (pane) pane.style.display = t === tab ? "block" : "none";
    if (btn) { btn.classList.toggle("tab-active", t === tab); btn.style.color = t === tab ? "#f59e0b" : "#7a6e60"; }
  });
}

/* ================================================================
   BODY EDITOR HELPERS
   ================================================================ */
function formatJson() { const e=document.getElementById("bodyEditor"); try{e.value=JSON.stringify(JSON.parse(e.value),null,2);toast("JSON formatted \u2713");}catch{toast("Invalid JSON");} }
function resetBody() { if(S.ep?.defaultBody){document.getElementById("bodyEditor").value=JSON.stringify(S.ep.defaultBody,null,2);toast("Reset to default payload");} }
function clearBody() { document.getElementById("bodyEditor").value=""; }

/* ================================================================
   REQUEST EXECUTION
   ================================================================ */
async function executeRequest() {
  const btn=document.getElementById("sendBtn"), icon=document.getElementById("sendIcon");
  const method=document.getElementById("methodSel").value, path=document.getElementById("pathInput").value.trim();
  const url=S.baseUrl+(path.startsWith("/")?"":"/")+path;
  const headers={"Accept":"application/json, text/html, */*"};
  const tok=S.tokens[S.role]; if(tok&&S.role!=="none") headers["Authorization"]="Bearer "+tok;
  const opts={method,headers};
  if(["POST","PATCH","PUT"].includes(method)){
    const body=document.getElementById("bodyEditor").value.trim();
    if(body){ try{JSON.parse(body);headers["Content-Type"]="application/json";opts.body=body;}catch{toast("Invalid JSON in body");switchTab("body");return;} }
  }
  btn.disabled=true; icon.textContent="\u23F3"; const t0=performance.now();
  try{
    const res=await fetch(url,opts); const ms=Math.round(performance.now()-t0);
    const ct=res.headers.get("content-type")||""; let data,isJson=false;
    if(ct.includes("application/json")){data=await res.json();isJson=true;}else data=await res.text();
    showRes(res.status,res.statusText,ms,data,isJson);
  }catch(e){
    showRes(0,"Network Error",Math.round(performance.now()-t0),{error:"Failed to connect",message:e.message,suggestion:"Ensure HoneyChain backend is running."},true);
  }finally{btn.disabled=false;icon.textContent="\u25B6";}
}

/* ================================================================
   RESPONSE DISPLAY
   ================================================================ */
function showRes(status,statusText,ms,data,isJson){
  document.getElementById("resEmpty").style.display="none";
  const pre=document.getElementById("resBody"); pre.style.display="block";
  const badge=document.getElementById("resStatus"); badge.style.display="inline-block";
  badge.textContent=status?(status+" "+statusText):"Network Error";
  badge.className=(status>=200&&status<300?"s-2xx":status>=300&&status<400?"s-3xx":status>=400&&status<500?"s-4xx":status>=500?"s-5xx":"s-err");
  badge.style.padding="3px 8px"; badge.style.borderRadius="5px"; badge.style.fontFamily="'Fira Code',monospace"; badge.style.fontSize="12px"; badge.style.fontWeight="700";
  document.getElementById("resTime").style.display="inline"; document.getElementById("resTimeVal").textContent=ms+" ms";
  const bytes=new Blob([typeof data==="string"?data:JSON.stringify(data)]).size;
  document.getElementById("resSize").style.display="inline"; document.getElementById("resSizeVal").textContent=fmtBytes(bytes);
  if(isJson) pre.innerHTML=hlJson(JSON.stringify(data,null,2)); else pre.textContent=String(data);
}
function hlJson(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/(\"(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\\"])*\"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{
      if(/^"/.test(m)) return/:$/.test(m)?`<span class="j-key">${m}</span>`:`<span class="j-str">${m}</span>`;
      if(/true|false/.test(m)) return `<span class="j-bool">${m}</span>`;
      if(/null/.test(m)) return `<span class="j-null">${m}</span>`;
      return `<span class="j-num">${m}</span>`;
    });
}

/* ================================================================
   COPY HELPERS
   ================================================================ */
function copyAsCurl(){
  if(!S.ep) return;
  const path=document.getElementById("pathInput").value, method=document.getElementById("methodSel").value;
  const url=S.baseUrl+(path.startsWith("/")?"":"/")+path, tok=S.tokens[S.role];
  let cmd=`curl -X ${method} "${url}" \\\n  -H "Accept: application/json"`;
  if(tok&&S.role!=="none") cmd+=` \\\n  -H "Authorization: Bearer ${tok}"`;
  if(["POST","PATCH","PUT"].includes(method)){const b=document.getElementById("bodyEditor").value.trim();if(b)cmd+=` \\\n  -H "Content-Type: application/json" \\\n  -d '${b.replace(/'/g,"'\\''")}' `;}
  navigator.clipboard.writeText(cmd); toast("cURL copied!");
}
function copyResponse(){ const pre=document.getElementById("resBody"); if(!pre.textContent)return; navigator.clipboard.writeText(pre.textContent); toast("Response copied!"); }
function copyToken(){ const tok=S.tokens[S.role]; if(!tok){toast("No token for unauthenticated persona");return;} navigator.clipboard.writeText(tok); toast("JWT token copied!"); }

/* ================================================================
   UTILS
   ================================================================ */
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("toast-show"); setTimeout(()=>el.classList.remove("toast-show"),2800); }
function fmtBytes(b){ if(b<1024)return b+" B"; if(b<1048576)return(b/1024).toFixed(1)+" KB"; return(b/1048576).toFixed(2)+" MB"; }
function esc(t){ if(!t)return""; return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
</script>
