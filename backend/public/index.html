<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Honeychain &bull; Batch Provenance Verification</title>
  <link rel="icon" type="image/png" href="/logohb.png">
  <link rel="shortcut icon" type="image/png" href="/logohb.png">
  <link rel="apple-touch-icon" href="/logohb.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0a07;
      color: #fbf8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #14100b;
      border: 1px solid #2a2015;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    h1 {
      font-size: 24px;
      color: #d69e1f;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .lead {
      color: #fbf8f2;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    p {
      color: #a89f91;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .info-box {
      background: #1c1610;
      border: 1px solid #332718;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-family: monospace;
      font-size: 13px;
      color: #d69e1f;
    }
    .meta {
      border-top: 1px solid #2a2015;
      padding-top: 16px;
      font-size: 12px;
      color: #786f63;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>System Operational</span>
    </div>
    <h1>HoneyChain</h1>
    <div class="lead">This is the backend service.</div>
    <p>This server handles API telemetry, authentication, machine learning analysis, and blockchain provenance for the HoneyChain platform.</p>
    <div class="info-box">GET /health &bull; status: 200 OK</div>
    <div class="meta">
      <span>Batch Provenance Verification</span>
      <span>Network: Ethereum Sepolia</span>
    </div>
  </div>
</body>
</html>
